<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lightblue Sudoku</title>

    <link rel="stylesheet" href="src/css/style.css">
</head>

<body>

    <header class="site-header">

        <div class="header-content">
            <h1>Lightblue Sudoku</h1>

            <div id="msg-board">
                <div id="dynamic-jump">
                    Today's Message: Happy 2 Year Anniversary 💜
                </div>

                <script>
                    const textContainer = document.getElementById('dynamic-jump');
                    const text = textContainer.innerText;
                    
                    textContainer.innerText = '';

                    [...text].forEach((char, index) => {
                        const span = document.createElement('span');
                        
                        span.innerHTML = char === ' ' ? '&nbsp;' : char;
                        
                        span.style.setProperty('--char-index', index);
                        
                        textContainer.appendChild(span);
                    });
                </script>
            </div>
        </div>

    </header>

    <main class="home-content">
        <h2>Welcome</h2>
        <a href="src/sudoku.html" class="menu-option">Play Sudoku</a>
        <a href="src/data.html" class="menu-option">Upload / Download Data</a>
        <a href="src/account.html" class="menu-option">Create / Manage Account</a>
        <a href="src/history.html" class="menu-option">View History</a>
    </main>

    <footer class="site-footer">
        Lightblue Sudoku © 2026
    </footer>

</body>
</html>
