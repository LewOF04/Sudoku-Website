<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lightblue Sudoku</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <center><h1>Sudoku</h1></center>

    <div id = "msg-board">
        <div id = "dynamic-jump">Today's Message: Happy 2 Year Anniversary 💜</div>

        <script>
            const textContainer = document.getElementById('dynamic-jump');
            const text = textContainer.innerText;
            
            textContainer.innerText = '';

            [...text].forEach((char, index) => {
                const span = document.createElement('span');
                
                span.innerHTML = char === ' ' ? '&nbsp;' : char;
                
                span.style.setProperty('--char-index', index);
                
                textContainer.appendChild(span);
            });
        </script>
    </div>

    <div class = "game-container">
        <div class="timer-container">
            <button id="playPauseBtn" aria-label="Start timer">
                <svg id="playIcon" class="timer-icon" viewBox="0 0 24 24">
                    <polygon points="8,5 19,12 8,19"/>
                </svg>

                <svg id="pauseIcon" class="timer-icon hidden" viewBox="0 0 24 24">
                    <rect x="6" y="5" width="4" height="14"/>
                    <rect x="14" y="5" width="4" height="14"/>
                </svg>
            </button>

            <div id="timer-display">00:00:00</div>
        </div>

        <div id="sudoku-grid"></div>
    </div>

    <script type="module" src="app.js"></script>

    <div id="numpad">
        <button type="button">1</button>
        <button type="button">2</button>
        <button type="button">3</button>
        <button type="button">4</button>
        <button type="button">5</button>
        <button type="button">6</button>
        <button type="button">7</button>
        <button type="button">8</button>
        <button type="button">9</button>
        <button type="button">X</button>
    </div>

    <br>

    <div class ="buttons">
        <button id="new-game">New Game</button>
    
        <div class="difficulty-selection">

            <label for="difficulty">Difficulty:</label>

            <select id="difficulty">
                <option value="beginner">Beginner</option>
                <option value="easy">Easy</option>
                <option value="medium" selected>Medium</option>
                <option value="hard">Hard</option>
                <option value="expert">Expert</option>
                <option value="impossible">Impossible</option>
            </select>

        </div>
    </div>

</body>
</html>
