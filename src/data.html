<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Upload / Download Data | Lightblue Sudoku</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <header class="site-header">

        <button id="menu-button" class="menu-button">
            ☰
        </button>

        <div class="header-content">
            <h1>Lightblue Sudoku</h1>

            <div id="msg-board">
                <div id="dynamic-jump">
                    Today's Message: Happy 2 Year Anniversary 💜
                </div>

                <script>
                    const textContainer = document.getElementById('dynamic-jump');
                    const text = textContainer.innerText;
                    
                    textContainer.innerText = '';

                    [...text].forEach((char, index) => {
                        const span = document.createElement('span');
                        
                        span.innerHTML = char === ' ' ? '&nbsp;' : char;
                        
                        span.style.setProperty('--char-index', index);
                        
                        textContainer.appendChild(span);
                    });
                </script>
            </div>
        </div>

    </header>


    <aside id="side-nav" class="side-nav">

        <button id="close-nav">×</button>

        <nav>
            <a href="./index.html">Home</a>
            <a href="./sudoku.html">Play Sudoku</a>
            <a href="./data.html" class = "active">Upload / Download Data</a>
        </nav>

    </aside>

    <div id="nav-overlay" class="nav-overlay"></div>

    <h1>Sudoku Data</h1>

    <!-- LOAD DATA -->
    <section>
        <h2>Load Data</h2>

        <label for="file-input">Select save file:</label>
        <input
            type="file"
            id="file-input"
            accept=".json"
        >

        <br><br>

        <label for="load-password">Password:</label>
        <input
            type="password"
            id="load-password"
        >

        <br><br>

        <button id="load-button">
            Load Data
        </button>

        <p id="load-message"></p>
    </section>


    <hr>


    <!-- SAVE DATA -->
    <section>
        <h2>Save Data</h2>

        <label for="save-password">Password:</label>
        <input
            type="password"
            id="save-password"
        >

        <br><br>

        <button id="save-button">
            Download Data
        </button>

        <p id="save-message"></p>
    </section>

    <footer class="site-footer">
        Lightblue Sudoku © 2026
    </footer>

    <script type="module" src="data_page.js"></script>
    <script src="./js/navigation.js"></script>

</body>

</html>
