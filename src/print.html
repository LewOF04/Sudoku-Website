<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Print Sudokus | Lightblue Sudoku</title>

    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/print.css">
</head>

<body>

    <header class="site-header">

        <button id="menu-button" class="menu-button">
            ☰
        </button>

        <div class="header-content">
            <h1>Lightblue Sudoku</h1>

            <div id="msg-board">
                <div id="dynamic-jump">
                    Today's Message: Happy 2 Year Anniversary 💜
                </div>

                <script>
                    const textContainer = document.getElementById('dynamic-jump');
                    const text = textContainer.innerText;
                    
                    textContainer.innerText = '';

                    [...text].forEach((char, index) => {
                        const span = document.createElement('span');
                        
                        span.innerHTML = char === ' ' ? '&nbsp;' : char;
                        
                        span.style.setProperty('--char-index', index);
                        
                        textContainer.appendChild(span);
                    });
                </script>
            </div>
        </div>

    </header>


    <aside id="side-nav" class="side-nav">

        <button id="close-nav">×</button>

        <nav>
            <a href="./index.html">Home</a>
            <a href="./sudoku.html">Play Sudoku</a>
            <a href="./data.html">Upload / Download Data</a>
            <a href="./account.html">Create / Manage Account</a>
            <a href="./history.html">View History</a>
            <a href="./print.html" class = "active">Print Sudokus</a>
        </nav>

    </aside>

    <div id="nav-overlay" class="nav-overlay"></div>

    <main class="print-content">

        <section id="print-options">

            <h1>Print Sudokus</h1>

            <p>Select how many Sudokus you would like:</p>

            <div class="difficulty-option">
                <label for="beginner-count">Beginner:</label>
                <input type="number" id="beginner-count" min="0" value="0">
            </div>

            <div class="difficulty-option">
                <label for="easy-count">Easy:</label>
                <input type="number" id="easy-count" min="0" value="0">
            </div>

            <div class="difficulty-option">
                <label for="medium-count">Medium:</label>
                <input type="number" id="medium-count" min="0" value="0">
            </div>

            <div class="difficulty-option">
                <label for="hard-count">Hard:</label>
                <input type="number" id="hard-count" min="0" value="0">
            </div>

            <div class="difficulty-option">
                <label for="expert-count">Expert:</label>
                <input type="number" id="expert-count" min="0" value="0">
            </div>

            <div class="difficulty-option">
                <label for="impossible-count">Impossible:</label>
                <input type="number" id="impossible-count" min="0" value="0">
            </div>

            <button id="generate-print">
                Generate Sudokus
            </button>

        </section>

        <section id="print-preview"></section>


        <div id="print-controls" class="hidden">
            <button id="print-button">
                Print
            </button>
        </div>

    </main>


    <footer class="site-footer">
        Lightblue Sudoku © 2026
    </footer>

    <script type="module" src="./js/print.js"></script>
    <script src="./js/navigation.js"></script>

</body>

</html>
